# The lambda architecture for view counts: a batch layer, a speed layer, and a serving layer.
#   docker compose up -d --build        start everything (3 days of logs in 90 s)
#   curl localhost:8000/status          the state of the layers
#   curl localhost:8000/photos/133422131/views

x-component: &component
  build:
    context: ..
    dockerfile: 08-lambda-architecture/Dockerfile
  image: photos-lambda
  depends_on:
    kafka:
      condition: service_healthy
    redis:
      condition: service_started
  environment:
    KAFKA_BOOTSTRAP: kafka:19092
    REDIS_HOST: redis
  volumes: ["./out:/app/08-lambda-architecture/out"]

services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    image: redis:8.10.2

  log-shipper:
    <<: *component
    command: [log-shipper]

  archiver:
    <<: *component
    command: [archiver]

  batch-layer:
    <<: *component
    command: [batch-layer]

  speed-layer:
    <<: *component
    command: [speed-layer]
    deploy: { replicas: 2 }

  serving:
    <<: *component
    command: [serving]
    ports: ["8000:8000"]
