# The load balancer in front of the instances of the keyword service.
events {}

http {
  upstream keywords {
    # the DNS name of the compose service returns the address of each instance
    server keywords:8000 max_fails=1 fail_timeout=10s;
  }

  server {
    listen 8000;
    location / {
      proxy_pass http://keywords;
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout http_502 http_503;  # try the next instance
    }
  }
}
