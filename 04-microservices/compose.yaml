# Four services and a load balancer. Only the gateway is reachable from outside.
#   docker compose up -d --build
#   curl -H "Authorization: Bearer token-ckaestne" localhost:8080/api/photos/133422131

x-service: &service
  build:
    context: ..
    dockerfile: 04-microservices/Dockerfile
  image: photos-services

services:
  gateway:
    <<: *service
    command: [gateway]
    ports: ["8080:8000"]
    depends_on: [photos, search, keywords-lb]

  photos:
    <<: *service
    command: [photos]

  search:
    <<: *service
    command: [search]

  keywords:
    <<: *service
    command: [keywords]
    deploy: { replicas: 3 }

  keywords-lb:
    image: nginx:1.31.6-alpine
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [keywords]
