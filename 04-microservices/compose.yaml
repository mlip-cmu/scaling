# Four services in three languages and a load balancer. Only the gateway is reachable from
# outside. Each service has its own folder, Dockerfile, and copy of the data it needs.
#   docker compose up -d --build
#   curl -H "Authorization: Bearer token-ckaestne" localhost:8080/api/photos/133422131

x-data: &data
  additional_contexts:
    data: ../photo-data/data/tables # the CSV files of the dataset

services:
  gateway: # JavaScript (Node.js)
    build: { context: gateway, <<: *data }
    ports: ["8080:8000"]
    depends_on: [photos, search, keywords-lb]

  photos: # Java
    build: { context: photos, <<: *data }

  search: # Python (FastAPI)
    build: { context: search, <<: *data }

  keywords: # Python (FastAPI)
    build: { context: keywords, <<: *data }
    deploy: { replicas: 3 }

  keywords-lb:
    image: nginx:1.31.6-alpine
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [keywords]
