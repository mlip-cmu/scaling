[project]
name = "sc04-microservices"
version = "0.1.0"
description = "Microservices behind an API gateway: routing, authentication, load balancing, retries"
requires-python = ">=3.12,<3.14"
dependencies = [
    "photo-data",
    "fastapi>=0.141",
    "uvicorn>=0.54",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.uv.sources]
photo-data = { path = "../photo-data", editable = true }
