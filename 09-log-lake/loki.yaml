# Loki as a single process with files on disk, for a demo.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2020-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: false        # the logs of the dataset are from 2021
  allow_structured_metadata: true
  volume_enabled: true
  discover_log_levels: true
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
  per_stream_rate_limit: 64MB
  per_stream_rate_limit_burst: 128MB
  max_query_series: 5000

querier:
  query_ingesters_within: 0        # also ask the ingesters about old times (the logs are from 2021)

ingester:
  chunk_retain_period: 24h         # keep flushed chunks in memory, so that queries find them at once
