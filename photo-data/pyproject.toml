[project]
name = "photo-data"
version = "0.1.0"
description = "Synthetic photo service dataset shared by all demos"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.3", "pandas>=2.3", "pyarrow>=21"]

[project.scripts]
photo-data = "photo_data.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
