[project]
name = "sc03-partitioning"
version = "0.1.0"
description = "Horizontal and vertical partitioning, consistent hashing, and partition pruning"
requires-python = ">=3.12,<3.14"
dependencies = [
    "photo-data",
    "duckdb>=1.5",
    "altair>=5.5",
    "vl-convert-python>=1.8",
    "jupyter>=1.1",
    "nbconvert>=7.16",
]

[tool.uv]
package = false

[tool.uv.sources]
photo-data = { path = "../photo-data", editable = true }
