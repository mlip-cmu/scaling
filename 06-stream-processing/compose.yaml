# The photo service as a set of components that communicate through Kafka topics.
#   docker compose up -d                                 start everything
#   docker compose logs -f notification-service          follow one component
#   docker compose up -d --scale object-detector=5       more instances
#   docker compose --profile ui up -d                    also Kafka UI on http://localhost:8080

x-component: &component
  build:
    context: ..
    dockerfile: 06-stream-processing/Dockerfile
  image: photos-stream
  depends_on:
    kafka:
      condition: service_healthy
  environment: &env
    KAFKA_BOOTSTRAP: kafka:19092

services:
  kafka:
    image: apache/kafka:4.3.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [ui]
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: photos
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  uploader-app:
    <<: *component
    command: [photo-uploader]
    environment: { <<: *env, UPLOAD_SOURCE: app }

  uploader-web:
    <<: *component
    command: [photo-uploader]
    environment: { <<: *env, UPLOAD_SOURCE: web }

  object-detector:
    <<: *component
    command: [object-detector]
    deploy: { replicas: 3 }

  friend-detector:
    <<: *component
    command: [friend-detector]
    deploy: { replicas: 2 }

  notification-service:
    <<: *component
    command: [notification-service]

  object-statistics:
    <<: *component
    command: [object-statistics]

  db-writer:
    <<: *component
    command: [db-writer]
    volumes: ["./out:/app/06-stream-processing/out"]
