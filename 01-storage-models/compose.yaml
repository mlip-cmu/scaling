# A relational database (PostgreSQL) and a document database (MongoDB).
#   docker compose up -d

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: photos
      POSTGRES_PASSWORD: photos
      POSTGRES_DB: photos
    ports: ["5432:5432"]
    healthcheck:
      test: pg_isready -U photos
      interval: 3s
      retries: 30

  mongo:
    image: mongo:8.0
    ports: ["27017:27017"]
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping').ok"
      interval: 3s
      retries: 30
