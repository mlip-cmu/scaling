[project]
name = "sc01-storage-models"
version = "0.1.0"
description = "The same photos in a relational database, a document database, and log files"
requires-python = ">=3.12,<3.14"
dependencies = [
    "photo-data",
    "psycopg[binary]>=3.2",
    "pymongo>=4.18",
]

[tool.uv]
package = false

[tool.uv.sources]
photo-data = { path = "../photo-data", editable = true }
