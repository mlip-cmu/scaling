# The photo service of 06 with monitoring: traces in Jaeger, metrics in Prometheus, and a
# Grafana dashboard. One object detector (object-detector-slow) runs an old, slow version.
#   docker compose up -d --build
#   http://localhost:3000     Grafana: the dashboard "Photo service"
#   http://localhost:16686    Jaeger: traces
#   http://localhost:9090     Prometheus: metrics

x-component: &component
  build:
    context: ..
    dockerfile: 10-stream-monitoring/Dockerfile
  image: photos-monitoring
  depends_on:
    kafka:
      condition: service_healthy
  environment: &env
    KAFKA_BOOTSTRAP: kafka:19092
    OTLP_ENDPOINT: http://jaeger:4318

services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null
      interval: 5s
      timeout: 10s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.0.10
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/photos.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  uploader-app:
    <<: *component
    command: [photo-uploader]
    environment: { <<: *env, UPLOAD_SOURCE: app, START_DELAY: 15 }

  uploader-web:
    <<: *component
    command: [photo-uploader]
    environment: { <<: *env, UPLOAD_SOURCE: web, START_DELAY: 15 }

  object-detector:
    <<: *component
    command: [object-detector]
    deploy: { replicas: 2 }

  object-detector-slow:
    <<: *component
    command: [object-detector]
    environment: { <<: *env, SLOW_PREPROCESS: 1 }

  friend-detector:
    <<: *component
    command: [friend-detector]
    deploy: { replicas: 2 }

  notification-service:
    <<: *component
    command: [notification-service]

  object-statistics:
    <<: *component
    command: [object-statistics]

  db-writer:
    <<: *component
    command: [db-writer]
    volumes: ["./out:/app/10-stream-monitoring/out"]
